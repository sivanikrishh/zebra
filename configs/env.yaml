# Environment (migratory-scene) parameters: geometry hook, scene and atmosphere stages.
# Same format as eye.yaml: value, sweep, unit, grade, cite (key into refs), note.
#   grade A = measured (in the relevant setting), B = derived in a published model / standard,
#   C = our assumption: must be swept, goes on the limits slide.
# Human-readable version: docs/model_parameters.md, environment section (keep in sync).
# Per-condition values (beta_550, aerosol, view azimuth, shadow / occlusion fractions, speed)
# live in configs/grid.yaml.

geometry:
  foreshortening_axis: {value: horizontal, grade: C, cite: null,
                        note: "body axis = image x for left/right side views; width x cos(view azimuth) before angular resampling"}

atmosphere:
  wavelengths_nm:
    value: [611.0, 549.0, 464.0]
    unit: nm
    grade: B
    cite: [srgb, cie1931]
    note: "dominant wavelengths of the sRGB R, G, B primaries vs D65 (colour-science, CIE 1931 2 deg); effective channel wavelengths for the Angstrom law"
  reference_nm: {value: 550.0, unit: nm, grade: B, cite: angstrom1929, note: "beta_550 is quoted at 550 nm"}
  koschmieder_threshold: {value: 0.02, unit: contrast, grade: B, cite: koschmieder1924,
                          note: "visual range V = ln(1/0.02)/beta = 3.912/beta"}
  mor_threshold: {value: 0.05, unit: transmittance, grade: B, cite: wmo_cimo,
                  note: "meteorological optical range MOR = ln(20)/beta = 2.996/beta (WMO: 5% of a collimated beam)"}
  apply_to_clear: {value: false, grade: C, cite: null,
                   note: "c0 (beta 0.0002/m, <= 4% contrast loss at 200 m) is the unhazed reference; the atmosphere stage leaves aerosol=clear untouched so c0 is unchanged"}
  aerosols:
    haze:
      alpha: {value: 1.3, sweep: [1.0, 1.6], unit: null, grade: C, cite: angstrom1929,
              note: "fine-mode (continental) aerosol; 1.3 is Angstrom's classic average value; not a savanna measurement"}
      airlight_rgb: {value: [0.80, 0.88, 1.00], unit: "linear RGB, relative", grade: C, cite: null,
                     note: "bluish-white horizon sky; rescaled to airlight_luminance"}
      airlight_luminance: {value: 0.90, sweep: [0.6, 1.2], unit: "x sunlit white", grade: C, cite: null}
    dust:
      alpha: {value: 0.2, sweep: [0.0, 0.5], unit: null, grade: B, cite: [dubovik2002, eck1999],
              note: "coarse mineral dust: near-neutral extinction; desert AERONET sites typically ~0.2-0.6"}
      airlight_rgb: {value: [1.00, 0.80, 0.55], unit: "linear RGB, relative", grade: C, cite: null,
                     note: "yellow-brown dust horizon; rescaled to airlight_luminance"}
      airlight_luminance: {value: 0.70, sweep: [0.4, 1.0], unit: "x sunlit white", grade: C, cite: null}
  airlight_regime_scaling: {value: absolute, grade: C, cite: null,
                            note: "airlight scales with regime luminance like the scene itself: images are relative, so the haze/scene ratio is the same at dusk; the absolute airlight (cd/m2) is logged and is 100x dimmer at dusk"}
  savanna_context: {value: null, grade: B, cite: boiyo2019,
                    note: "Nairobi AERONET annual mean AOD(440 nm) 0.19 +- 0.04; over a ~1-2 km mixing layer that is ~1e-4/m near-surface extinction, consistent with c0 (2e-4/m). c1-c3 are standard meteorological visibility classes, not savanna measurements"}

scene:
  shadow:
    darkening: {value: 0.55, sweep: [0.40, 0.70], unit: "fraction of luminance removed", grade: C, cite: null,
                note: "cast shadow lit by skylight only"}
    tint_rgb: {value: [0.90, 1.00, 1.15], unit: "relative, luminance-normalised", grade: C, cite: null,
               note: "skylight-only shadows are bluish"}
    penumbra_sigma: {value: 0.04, sweep: [0.02, 0.08], unit: "x region width", grade: C, cite: null}
    blob_scale: {value: 0.25, unit: "x region size", grade: C, cite: null, note: "smoothness of the shadow shape (tree canopy / neighbour)"}
  occlusion:
    grass_rgb: {value: [0.30, 0.25, 0.10], unit: "linear RGB", grade: C, cite: null, note: "dry savanna grass (sRGB ~150,138,90)"}
    grass_texture: {value: 0.15, unit: "relative std", grade: C, cite: null}
    blade_width: {value: 0.012, sweep: [0.006, 0.025], unit: "x region width", grade: C, cite: null}
    blade_max_height: {value: 0.45, unit: "x region height", grade: C, cite: null, note: "blades rise from the lower edge"}
    neighbour_share: {value: 0.4, unit: "share of occlusion from neighbour silhouettes", grade: C, cite: null}
  background:
    default: {value: none, grade: C, cite: null, note: "crops keep their photo background; plates are for scenes/VR"}
    plates:
      short_green: {value: [0.10, 0.16, 0.05], unit: "linear RGB mean", grade: C, cite: null}
      tall_dry: {value: [0.33, 0.27, 0.12], unit: "linear RGB mean", grade: C, cite: null}
      bare_dust: {value: [0.38, 0.28, 0.18], unit: "linear RGB mean", grade: C, cite: null}
    texture: {value: 0.18, unit: "relative std (multi-scale noise)", grade: C, cite: null}

motion:
  speeds_mps: {value: [0.0, 2.0, 5.0], unit: m/s, grade: C, cite: null,
               note: "conditions m2, m5; walking-to-trotting range; direction horizontal"}

refs:
  koschmieder1924: {text: "Koschmieder H (1924) Theorie der horizontalen Sichtweite. Beitr Phys freien Atmos 12:33-53, 171-181", doi: null, verified: true,
                    note: "classic; 0.02 threshold and 3.912 factor confirmed via WMO CIMO guide and secondary sources; page range varies between sources"}
  wmo_cimo: {text: "WMO (2018) Guide to Instruments and Methods of Observation (WMO-No. 8), Vol. I, Ch. 9 Measurement of visibility", url: "https://old.wmo.int/extranet/pages/prog/www/IMOP/publications/CIMO-Guide/Prelim_2018_ed/8_I_9_en_MR_tc.pdf", verified: true,
             note: "MOR = path reducing a 2700 K collimated beam to 5%; 2.996 = ln 20 derived"}
  angstrom1929: {text: "Angstrom A (1929) On the atmospheric transmission of sun radiation and on dust in the air. Geogr Ann 11:156-166", doi: null, verified: false,
                 note: "UNVERIFIED: origin of the exponent is confirmed in secondary sources; the 1.3 'average' value was not confirmed in this session"}
  dubovik2002: {text: "Dubovik O et al. (2002) Variability of absorption and optical properties of key aerosol types observed in worldwide locations. J Atmos Sci 59:590-608", doi: null, verified: true,
                note: "citation confirmed; desert-dust Angstrom ~0.24-0.6 reported in a secondary source citing it; DOI not confirmed"}
  eck1999: {text: "Eck TF et al. (1999) Wavelength dependence of the optical depth of biomass burning, urban, and desert dust aerosols. J Geophys Res 104(D24):31333-31349", doi: "10.1029/1999JD900923", verified: true}
  boiyo2019: {text: "Boiyo R, Kumar KR, Zhao T, Guo J (2019) A 10-year record of aerosol optical properties and radiative forcing over three environmentally distinct AERONET sites in Kenya, East Africa. J Geophys Res Atmos", doi: "10.1029/2018JD029461", verified: true}
  srgb: {text: "IEC 61966-2-1:1999 sRGB primaries and D65 white point (as implemented in colour-science)", doi: null, verified: true}
  cie1931: {text: "CIE 1931 2-degree standard observer (colour-science dataset)", doi: null, verified: true}

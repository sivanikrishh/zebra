# Simulation grid: 16 distances x 10 conditions x regions.

distances_m:
  spacing: log
  start: 2.0
  stop: 200.0
  n: 16
  # np.geomspace(2, 200, 16), rounded to mm; zebrasight.config.distances() regenerates them exactly
  values: [2.0, 2.719, 3.696, 5.024, 6.829, 9.283, 12.619, 17.154, 23.318, 31.698,
           43.089, 58.573, 79.621, 108.234, 147.128, 200.0]

# beta_haze: atmospheric extinction coefficient, 1/m.
# azimuth_view_deg: angle of the viewed flank away from side-on (0 = side-on).
# luminance_cd_m2: from configs/eye.yaml luminance block.
conditions:
  c0: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.0002, azimuth_view_deg: 0,  note: "reference: clear midday, side-on"}
  c1: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.002,  azimuth_view_deg: 0,  note: "light haze"}
  c2: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.01,   azimuth_view_deg: 0,  note: "moderate haze"}
  c3: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.03,   azimuth_view_deg: 0,  note: "heavy haze"}
  c4: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.0002, azimuth_view_deg: 30, note: "view azimuth 30 deg"}
  c5: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.0002, azimuth_view_deg: 60, note: "view azimuth 60 deg"}
  c6: {light: day,   luminance_cd_m2: 16.0,    beta_haze: 0.0002, azimuth_view_deg: 75, note: "view azimuth 75 deg"}
  c7: {light: dawn,  luminance_cd_m2: 0.16,    beta_haze: 0.0002, azimuth_view_deg: 0,  note: "dawn (= dusk regime, grade C)"}
  c8: {light: dusk,  luminance_cd_m2: 0.16,    beta_haze: 0.0002, azimuth_view_deg: 0,  note: "dusk"}
  c9: {light: night, luminance_cd_m2: 1.6e-5,  beta_haze: 0.0002, azimuth_view_deg: 0,  note: "moonless night"}

# Conditions with identical model inputs: computed once, stored as an alias.
# c7 dawn and c8 dusk share the luminance regime (0.16 cd/m2, mesopic, grade C).
store_aliases: {c7: c8}

regions: [flank, face, rump]

phase1:
  conditions: [c0]
  stages: [geometry, eye]

all_stages: [geometry, scene, atmosphere, eye]

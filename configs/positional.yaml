# Positional-pattern toolkit (branch "positional"). Every parameter: value + one-line justification.
# Regions: body (full body), flank, rump. Condition c0 only. 50-zebra set (data/regions_50.parquet).
# Coat-unit scales are in CYCLES PER BODY LENGTH (cpbl); body length = 231.5 cm (gzgc.BODY_LENGTH_CM).

data:
  regions_50: data/regions_50.parquet        # the 50-zebra analysis set (gallery/query on different dates)
  regions_full: data/regions.parquet         # 321-zebra table; source of the held-out set
  out_regions: data/regions_50_positional.parquet   # body + flank + rump rows for the positional study
  body_mask_dir: data/masks/gzgc_v2_body     # body-only PNGs (1 = body), written from the v2 label PNGs (label > 0)
  heldout_csv: data/heldout_zebras.csv       # frozen confirmation set (amendment A5)
  store: cache/percepts_50.zarr              # existing 50-zebra percept store; body/rump c0 rows are added to it
  out_dir: outputs/positional                # reports, alignments, observer outputs
  regions: [body, flank, rump]               # no face: the face crop is unreliable (OWLv2 / silhouette fallback)
  condition: c0                              # clear day only: isolates the eye's distance loss

body_quality:                                # A1: which photos show the WHOLE body well enough for full-body analysis
  edge_margin_px: 2                          # annotation box within 2 px of the frame = animal cut off by the photo edge
  min_mask_fill: 0.40                        # body mask / box area; side-on bodies fill ~0.52 (median), < 0.40 (~5th pct) = partial or occluded
  max_other_zebra_cover: 0.10                # another zebra's box covering > 10% of this box = likely overlap of bodies
  require_mask: true                         # bbox_rule rows have no body mask (whole box), so no body shape

heldout:                                     # A3: frozen before any positional result
  seed: 20261123                             # fixed seed; the date the set was frozen
  min_gallery: 1                             # at least one earliest-date photo ...
  min_query: 1                               # ... and one later-date photo, so a cross-date pair exists
  max_photos: 4                              # same cap as the 321-zebra table (2 gallery + 2 query)
  viewpoint: left                            # same side as the 50-zebra set

frame:                                       # B1 canonical body frame
  grid_uv: [100, 60]                         # u along the body (head -> tail), v across (back -> belly): 1 unit = 1% length / 1.67% height
  head_left_viewpoints: [left, frontleft, backleft]   # left-side views face the viewer's left (verified on QA grids, heads.py)
  parts:                                     # fixed rules in frame units [u0, u1, v0, v1]; grade C, matched to the v2 trunk rule
    head:      [0, 15, 0, 60]                # front ~15% of length: head (face region is ~0.22 x length incl. muzzle)
    neck:      [12, 30, 0, 35]               # behind the head, upper part only (the throat/chest below belongs to legs/chest)
    shoulder:  [28, 42, 0, 40]               # trunk start (v2 flank starts at shoulder + 15% of trunk)
    mid_flank: [42, 62, 0, 40]               # middle of the trunk, the v2 flank core
    hip:       [62, 78, 0, 40]               # trunk end before the rump
    rump:      [78, 100, 0, 45]              # rear ~22% (v2 rump = rear 25% of the trunk)
    legs:      [25, 100, 40, 60]             # lower third: legs and belly line

align:                                       # B2 pairwise alignment on sharp ORIGINAL crops
  max_side_px: 512                           # same working size as the HotSpotter observer (speed, comparable SIFT scale)
  ratio: 0.8                                 # Lowe ratio test, as the HotSpotter observer (amendment A1)
  ransac_px: 3.0                             # RANSAC reprojection threshold, as A1
  min_inliers_affine: 4                      # fewer than 4 inliers: affine not trusted (A4 rule) -> canonical fallback
  min_inliers_tps: 12                        # thin-plate spline only with >= 12 points (3x its 4 affine dof, avoids overfit)
  tps_lambda: 1.0                            # TPS smoothing (px^2): keeps the warp near-affine between sparse points
  min_overlap: 0.5                           # aligned_ok needs >= 50% of the smaller mask covered after warping
  max_residual_px: 4.0                       # aligned_ok needs median inlier residual <= 4 px (just above RANSAC's 3 px)
  max_anisotropy: 2.0                        # SIFT affine rejected if its singular values differ > 2x (B4 QA: few collinear inliers squash the map to a line); grade C
  max_scale_ratio: 1.5                       # ... or if its linear scale differs > 1.5x from the canonical-frame map's (same animal, similar distance); grade C
  go_no_go_share: 0.60                       # B4 rule: >= 60% of same-zebra pairs need >= 4 inliers, else better fallback

observers:                                   # C1-C8, all in cycles per body length (cpbl), converted per percept
  body_length_cm: 231.5                      # plains zebra head-body length midpoint (gzgc.BODY_LENGTH_CM)
  stripe_period_cpbl: 24                     # flank period ~9-10 cm over 231.5 cm (measured median 7.9 cm on our crops)
  gabor_scales_cpbl: [6, 12, 24, 48]         # 1-octave steps around the stripe period: layout -> stripe -> sub-stripe detail
  gabor_bandwidth_oct: 1.0                   # 1-octave Gabor (standard for V1-like filters; adjacent scales overlap at half power)
  gabor_orientations: 6                      # 0-150 deg in 30 deg steps (covers stripe flow at the bandwidth's angular resolution)
  min_wavelength_px: 2.5                     # a scale finer than 2.5 px per cycle is beyond the percept grid: skipped (invalid)
  phase_grid_uv: [40, 24]                    # IrisCode cells over the canonical frame (2.5 x 2.5 frame units, ~1/10 stripe period)
  phase_noise_floor: 0.5                     # bit valid if |response| >= 0.5 x the region's median |response| over ALL scales/orientations (weak, noise-only scales drop out)
  phase_shift_search_bl: 0.02                # residual shift search +/- 2% of body length (iris-style rotation search)
  phase_shift_steps: 5                       # 5 x 5 shifts within that range
  orient_grid_uv: [20, 12]                   # 12 x 20 canonical grid for stripe flow
  orient_grad_sigma_period: 0.25             # structure-tensor gradient sigma = 0.25 stripe period
  orient_rho_periods: [1, 2]                 # integration windows of 1 and 2 stripe periods (score = mean of the two)
  orient_hist_bins: 18                       # 10 deg bins for the pooled orientation control
  minutiae_tol_period: 0.5                   # minutiae matched within half a stripe period
  min_valid_cells: 10                        # fewer valid cells than this: score = NaN (counted as a miss)

generators:                                  # D1-D7 (built and tested here, run at scale on the DGX)
  bands_cpbl: [[3, 6], [6, 12], [12, 24], [24, 48], [48, 96]]   # octave bands around the stripe period
  shuffle_tiles_bl: [0.05, 0.1, 0.2, 0.4]    # patch-shuffle tile size as fraction of body length
  occlusion_size_bl: 0.10                    # occluder patch 10% of body length (~1 stripe group)
  occlusion_stride_bl: 0.05                  # half-overlapping occluders
  morph_pos_amp_period: [0.01, 0.02, 0.05, 0.1, 0.2]   # positional tweak RMS amplitude as fraction of stripe period
  morph_smooth_period: 2.0                   # displacement field smoothness: Gaussian sigma = 2 stripe periods
  morph_width_change: [-0.4, -0.2, -0.1, 0.1, 0.2, 0.4]   # stripe width change (fraction of stripe width)
  morph_contrast: [0.5, 0.75, 1.0]           # contrast scaling around the region mean
  transplant_feather_bl: 0.02                # seam feathering 2% of body length
  seeds: [0, 1, 2]                           # 3 seeds per random generator

smoke:                                       # Part F (laptop): tiny sanity run, not the experiment
  n_zebras: 5                                # 5 zebras with body_ok photos on both dates
  seed: 7                                    # fixed choice of the 5
  distance_indices: [0, 6, 9]                # 2.0, 12.6, 31.7 m of the 16-distance grid
  n_diff_pairs: 20                           # different-zebra pairs for the B4 alignment check

projection:                                  # Part F: rough full-run time projection from the smoke timings (grade C, planning only)
  laptop_workers: 4                          # = run.n_jobs on the laptop (observers are CPU-bound per pair)
  dgx_workers: 32                            # DGX: 32 CPU cores, one pair per worker
  dgx_cpu_speedup: 1.0                       # per-core speed DGX vs laptop i7 assumed equal (conservative)
  dgx_gpu_speedup: 5.0                       # percept generation, data-centre GPU vs RTX 3050 Laptop (assumed ~5x)
  generator_passes: 60                       # ~ladder passes for Part D steps: bands 10 + shuffle 12 + scramble 3 + silhouette 2 + morph 24 + transplant ~9 (occlusion maps excluded)

run:
  n_jobs: 4                                  # CPU workers for joblib steps; Windows laptop default, raise on the DGX
  device: auto                               # cuda if available else cpu
  low_priority: true                         # keep the laptop usable during long runs
  n_boot: 1000                               # bootstrap resamples over zebras for AUC CIs (metrics.yaml n_boot_final)
